version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/GoCore"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/Presentation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
