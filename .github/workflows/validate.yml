name: Validate Windows sources and pinned core integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Synthetic source checks (no application build)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate synthetic bundles and pinned references
        shell: pwsh
        run: ./tests/CoreBundle.Tests.ps1
      - name: Check declared core reference
        shell: pwsh
        run: |
          $pin = Get-Content core-reference.json -Raw | ConvertFrom-Json
          if ($pin.SourceRevision -cnotmatch '^[0-9a-f]{40}$' -or $pin.Repository -cne 'OneTunnel-Core' -or
              $pin.SchemaVersion -ne 1 -or $pin.ApiVersion -ne 1 -or $pin.Version -notmatch '^\d+\.\d+\.\d+$' -or
              $pin.OS -cne 'windows' -or $pin.Architecture -cne 'amd64') { throw 'Invalid core source pin.' }
          'Synthetic source checks passed. The application build requires the explicit manual pinned-core integration job.' | Add-Content $env:GITHUB_STEP_SUMMARY

  windows-build:
    name: Explicit Windows x64 build with pinned core
    if: github.event_name == 'workflow_dispatch'
    needs: source-validation
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select trusted pinned core source
        id: core
        env:
          CORE_REPOSITORY: ${{ vars.ONETUNNEL_CORE_REPOSITORY || 'NikolaBasser/OneTunnel-Core' }}
        run: |
          if ($env:CORE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'ONETUNNEL_CORE_REPOSITORY must identify a trusted owner/repository.'
          }
          $pin = Get-Content core-reference.json -Raw | ConvertFrom-Json
          if ($pin.SourceRevision -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid pinned core commit.' }
          "revision=$($pin.SourceRevision)" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ONETUNNEL_CORE_REPOSITORY || 'NikolaBasser/OneTunnel-Core' }}
          ref: ${{ steps.core.outputs.revision }}
          token: ${{ secrets.CORE_READ_TOKEN || github.token }}
          path: artifacts/core-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: artifacts/core-source/go.sum
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build the explicitly selected core source
        run: ./artifacts/core-source/build.ps1 -GoExecutable (Get-Command go).Source -Output "$PWD/artifacts/core-bundle"
      - name: Build and package the Windows application
        run: ./scripts/Build.ps1 -Name OneTunnel-ci-win-x64 -CoreBundlePath "$PWD/artifacts/core-bundle"
      - name: Verify actual core output selection
        run: ./tests/CoreBoundary.Integration.ps1 -CoreBundlePath "$PWD/artifacts/core-bundle"
      - name: Check the workspace with isolated synthetic profiles
        run: powershell.exe -NoProfile -Command "dotnet run --project tests/WorkspaceUi.Check/WorkspaceUiCheck.csproj -c Release -r win-x64 -p:CoreBundlePath=$PWD/artifacts/core-bundle"
